spring:
  application:
    name: kyb-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kyb?reWriteBatchedInserts=true}
    username: ${DB_USER:kyb}
    password: ${DB_PASSWORD:kyb}
  flyway:
    enabled: true
  # Scoring rules live in their own versioned file (spec §9).
  config:
    import: classpath:scoring-rules.yml

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      # Component names (db, diskSpace, ...) are visible so operators can see what is down;
      # details (versions, paths, sizes) stay hidden from unauthenticated callers.
      show-components: always
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

kyb:
  security:
    # Callers send this as X-Api-Key on every /api/** request. Unset means every API call is
    # refused (fail closed), never left open by accident.
    api-key: ${KYB_API_KEY:}
  checks:
    # Bump when matching or scoring CODE changes (config changes are versioned in scoring-rules.yml).
    # The normaliser version is appended automatically.
    engine-version: 2.1.0
    include-resigned-officers: false
    # Companies House gives nationality as a demonym; the matcher compares ISO 3166-1 alpha-2 codes.
    # Unknown nationalities are simply not compared (neutral). Keys are lower case.
    nationalities:
      "[british]": gb
      "[english]": gb
      "[scottish]": gb
      "[welsh]": gb
      "[northern irish]": gb
      "[irish]": ie
      "[american]": us
      "[canadian]": ca
      "[australian]": au
      "[new zealander]": nz
      "[french]": fr
      "[german]": de
      "[italian]": it
      "[spanish]": es
      "[portuguese]": pt
      "[dutch]": nl
      "[belgian]": be
      "[swiss]": ch
      "[austrian]": at
      "[swedish]": se
      "[norwegian]": "no"
      "[danish]": dk
      "[finnish]": fi
      "[polish]": pl
      "[romanian]": ro
      "[bulgarian]": bg
      "[greek]": gr
      "[cypriot]": cy
      "[turkish]": tr
      "[russian]": ru
      "[ukrainian]": ua
      "[belarusian]": by
      "[chinese]": cn
      "[indian]": in
      "[pakistani]": pk
      "[bangladeshi]": bd
      "[nigerian]": ng
      "[south african]": za
      "[emirati]": ae
      "[saudi arabian]": sa
      "[iranian]": ir
      "[iraqi]": iq
      "[syrian]": sy
      "[afghan]": af
      "[north korean]": kp
      "[venezuelan]": ve
      "[cuban]": cu
  cache:
    max-local-entries: 10000
  companies-house:
    base-url: https://api.company-information.service.gov.uk
    api-key: ${COMPANIES_HOUSE_API_KEY:}
    cache-ttl: 24h
    items-per-page: 100
    # Safety stop for pagination (100 x 50 = 5,000 officers/PSCs)
    max-pages: 50
    connect-timeout: 5s
    read-timeout: 10s
    rate-limit:
      # Upstream allows 600 per 5 minutes; stay below so normal use never sees a 429.
      limit: 550
      period: 5m
      # How long a request may wait for a local permit before failing over to cache.
      max-wait: 5s
    retry:
      max-retries: 3
      base-delay: 500ms
      max-delay: 10s
  fca:
    # FCA Financial Services Register API (free registration). Path and headers match the
    # developer portal's introduction, which needs sign-in (also verified by smoke test).
    base-url: https://register.fca.org.uk/services/V0.1
    auth-email: ${FCA_AUTH_EMAIL:}
    auth-key: ${FCA_AUTH_KEY:}
    # Free, no SLA (spec §5.2): results are cached for a week and served stale during outages.
    cache-ttl: 7d
    connect-timeout: 5s
    read-timeout: 10s
    rate-limit:
      # Documented limit: 50 requests per 10 seconds, subject to change (an error, then a 1-minute block).
      limit: 45
      period: 10s
      max-wait: 2s
    circuit-breaker:
      failure-rate-threshold: 50
      sliding-window-size: 10
      minimum-number-of-calls: 5
      wait-duration-in-open-state: 60s
      permitted-calls-in-half-open-state: 2
    # Firm-details lookups per check (each one compares the Companies House number).
    max-details-lookups: 3
    authorised-statuses: [Authorised, EEA Authorised, Registered]
    # Unauthorised and clone-firm entries, recognised by status or by name.
    warning-statuses: [Unauthorised]
    warning-name-markers: [clone, unauthorised, not authorised]
    # Added to name similarity when the FCA postcode equals the registered office postcode.
    postcode-boost: 0.05
  sanctions:
    # Bulk data only, never the hosted API (spec §5.3). The index names the current export version,
    # the file URL (a 307 to a versioned artifact) and its SHA-1.
    index-url: https://data.opensanctions.org/datasets/latest/sanctions/index.json
    resource-name: entities.ftm.json
    schemas: [Person, Company, Organization, LegalEntity]
    # The file also holds related-but-not-sanctioned people, counter-sanctions, debarments and
    # export-control entries. Only sanctioned (or sanction-linked) entities are screened.
    topics: [sanction, sanction.linked]
    batch-size: 1000
    # Active + previous versions kept so past checks can be replayed against their exact data (M6).
    keep-versions: 3
    max-malformed-lines: 100
    connect-timeout: 10s
    # Index: limit for the whole request. Download: abort only if no bytes arrive for this long, so a
    # healthy multi-minute transfer is never cut off but a stalled one cannot hold the import slot.
    read-timeout: 60s
    # Upstream re-exports roughly every 6 hours. Nightly is enough for v1. "-" disables it.
    cron: ${KYB_SANCTIONS_IMPORT_CRON:0 30 3 * * *}
    zone: Europe/London
    # Off by default so tests and IDE runs never download ~380 MB. docker-compose turns it on.
    import-on-startup-if-empty: ${KYB_SANCTIONS_IMPORT_ON_STARTUP:false}
  matching:
    # Lists are written in normalised form (lower case, no dots or apostrophes).
    honorifics: [mr, mrs, ms, miss, mx, dr, prof, professor, sir, dame, lord, lady, hon, rev, revd,
                 sheikh, sheik, shaikh, haji, hajji]
    # Removed from the END of organisation names, repeatedly, longest phrase first.
    legal-forms: [public limited company, limited liability company, limited liability partnership,
                  joint stock company, sdn bhd, ltd, limited, plc, llp, llc, lp, inc, incorporated,
                  corp, corporation, co, company, gmbh, ag, sa, sas, sarl, srl, spa, bv, nv, oy, ab,
                  asa, kft, sro, ooo, oao, zao, pao, ao, jsc, ojsc, cjsc, pjsc, fze, fzco, fzc, pte,
                  pty, bhd]
    # Removed from the START of organisation names: only forms that are written first, so names
    # such as "Co-operative Bank" keep their first word.
    leading-legal-forms: [the, ooo, oao, zao, pao, ao, jsc, ojsc, cjsc, pjsc, tov, pt]
    weights:
      jaro-winkler: 0.30
      token-overlap: 0.15
      phonetic: 0.15
      alignment: 0.40
    tokens:
      initial-similarity: 0.70
      phonetic-similarity: 0.90
      # 0.20, not 0.10: tuned on the full dataset, where "John Smith" vs "John B. Pridmore-Smith"
      # (two unmatched tokens) came out STRONG. One extra middle name still stays STRONG.
      extra-token-penalty: 0.20
    bands:
      strong: 0.90
      possible: 0.80
    birth-date:
      exact-boost: 0.05
      partial-boost: 0.02
      year-tolerance: 1
      mismatch-penalty: 0.25
    country:
      match-boost: 0.03
      mismatch-penalty: 0.05
    retrieval:
      trigram-threshold: 0.30
      max-candidates: 50
    max-matches: 10
    # OpenSanctions source dataset ids (verified 2026-11-07) -> labels shown in results.
    source-list-labels:
      gb_fcdo_sanctions: UK FCDO
      gb_hmt_invbans: UK HMT investment bans
      eu_fsf: EU
      eu_sanctions: EU
      eu_journal_sanctions: EU Official Journal
      us_ofac_sdn: US OFAC SDN
      us_ofac_cons: US OFAC non-SDN
      us_trade_csl: US Consolidated Screening List
      un_sc_sanctions: UN Security Council
      ch_seco_sanctions: Switzerland SECO
      ua_nsdc_sanctions: Ukraine NSDC

# JSON (ECS) console logging is switched on via LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs
# in docker-compose; local runs and tests keep human-readable logs.
