services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kyb
      POSTGRES_USER: ${DB_USER:-kyb}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kyb}
    ports:
      # Not 5432, which any Postgres already on the machine holds, and that bind failure stops the stack.
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d kyb"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      # reWriteBatchedInserts: the driver sends each insert batch as multi-row INSERTs (sanctions import)
      DB_URL: jdbc:postgresql://postgres:5432/kyb?reWriteBatchedInserts=true
      DB_USER: ${DB_USER:-kyb}
      DB_PASSWORD: ${DB_PASSWORD:-kyb}
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      # First start with an empty database loads the OpenSanctions data (~380 MB download) in the background
      KYB_SANCTIONS_IMPORT_ON_STARTUP: "true"
    ports:
      # Local only: metrics and the API docs are not behind the API key.
      - "127.0.0.1:${KYB_PORT:-8080}:8080"

volumes:
  pgdata:
