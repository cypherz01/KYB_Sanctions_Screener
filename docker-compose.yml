services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kyb
      POSTGRES_USER: ${DB_USER:-kyb}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kyb}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d kyb"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/kyb
      DB_USER: ${DB_USER:-kyb}
      DB_PASSWORD: ${DB_PASSWORD:-kyb}
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    ports:
      - "8080:8080"

volumes:
  pgdata:
