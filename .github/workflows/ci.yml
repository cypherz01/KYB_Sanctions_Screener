name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Check formatting
        run: ./mvnw -B spotless:check

      # Unit + integration tests (Testcontainers uses the runner's Docker) and JaCoCo report
      - name: Build and test
        run: ./mvnw -B verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

      - name: Build Docker image
        run: docker build -t kyb-service:ci .

      # The newcomer's first command, for real: the Compose stack, the stubs and the walkthrough.
      - name: Run the keyless demo
        run: scripts/demo.sh

      - name: Show the demo's logs if it failed
        if: failure()
        run: docker compose -f docker-compose.demo.yml logs
